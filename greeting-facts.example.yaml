# 虚构示例。复制到 $JOB_AGENT_HOME/greeting-facts.yaml，换成你本人确认过的小经历。
# 只有 confirmed: true 的条目会被使用；生成时只在岗位相关时用一条。
version: 1
facts:
- id: tool-cost
  text: 之前觉得某个接口太贵，我自己找了个替代方案换上去，每年省了一笔钱。
  when: JD 提到成本、搜索、工具调用，或者想体现主动性
  tags:
  - 省钱
  - 主动性
  - 搜索
  confirmed: true
  source: 填写这条经历的出处，比如简历里的哪一条
- id: own-dataset
  text: 毕设没有现成数据，我就自己采集照片来训练模型。
  when: JD 提到图像、视觉、数据采集、校招或应届
  tags:
  - 图像
  - 数据采集
  confirmed: false
  source: 填写这条经历的出处
