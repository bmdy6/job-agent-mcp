# 风格参考，不是填空模板；学语气，用逗号连成自然的话。只用配置事实和当前JD。
version: 1
directions:
  rag:
    tags:
    - RAG
    - 知识库
    - 检索
    - MCP
    example:
    - 你好，我是小林，做AI应用开发的，已离职，随时能到岗。
    - 看你们在做知识问答，这块我熟。之前做过31个知识库的问答，旧文档把答案带偏这种事专门处理过。
    - 我也习惯先测再上，加过的功能测下来没用，我就关掉。
    - 简历发你看看？
  agent:
    tags:
    - Agent
    - AI助手
    - 多智能体
    - 智能体
    - 长期记忆
    example:
    - 你好，我是小林，做AI应用开发，已离职随时能到岗。
    - 你们要做AI的记忆，这个我做过。上家公司的AI助手有一万多用户，记住用户偏好这块是我负责的。
    - 方便的话发份简历给你？
  automation:
    tags:
    - 自动化
    - 工程化
    - 评测
    - 流水线
    - 工作流
    - 流程
    example:
    - 你好，我是小林，做AI应用开发的，已离职随时能到岗。
    - 看你们在做AI写代码。我在上家公司搭过一套让AI帮忙写代码、测代码的流程，团队一周能交付的需求从6个左右涨到了50个左右。
    - 有兴趣的话我发简历过来。
  vision:
    tags:
    - 图像
    - 视觉
    - 多模态
    - 识别
    example:
    - 你好，我是小林，今年毕业，做AI应用开发，已离职随时能到岗。
    - 看你们要做图像识别。我毕设做的就是食堂菜品识别，没有现成数据，就自己一张张采集餐盘照片来训练，准确率做到95%以上。
    - 简历发你看看？
