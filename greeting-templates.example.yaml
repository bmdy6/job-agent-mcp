# 风格参考，不是填空模板；学语气，用逗号连成自然的话。只用配置事实和当前JD。
# 以下经历均为虚构示例，复制到 $JOB_AGENT_HOME/greeting-templates.yaml 后换成你自己的。
version: 1
directions:
  rag:
    tags:
    - RAG
    - 知识库
    - 检索
    - MCP
    example:
    - 你好，我是小林，做AI应用开发的，已离职，随时能到岗。
    - 看你们在做知识问答，这块我熟。之前做过公司内部文档的问答，答案对不上原文这种事专门处理过。
    - 我也习惯先测再上，加过的功能测下来没用，我就关掉。
    - 简历发你看看？
  agent:
    tags:
    - Agent
    - AI助手
    - 多智能体
    - 智能体
    - 长期记忆
    example:
    - 你好，我是小林，做AI应用开发，已离职随时能到岗。
    - 你们要做AI的记忆，这个我做过。之前做的AI助手要记住用户偏好，这块是我负责的。
    - 方便的话发份简历给你？
  automation:
    tags:
    - 自动化
    - 工程化
    - 评测
    - 流水线
    - 工作流
    - 流程
    example:
    - 你好，我是小林，做AI应用开发的，已离职随时能到岗。
    - 看你们在做AI写代码。我之前搭过一套让AI帮忙写代码、测代码的流程，团队交付快了不少。
    - 有兴趣的话我发简历过来。
  vision:
    tags:
    - 图像
    - 视觉
    - 多模态
    - 识别
    example:
    - 你好，我是小林，今年毕业，做AI应用开发，已离职随时能到岗。
    - 看你们要做图像识别。我毕设做的就是图像分类，没有现成数据，就自己采集照片来训练。
    - 简历发你看看？
