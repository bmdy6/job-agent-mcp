# Copy to $JOB_AGENT_HOME/config.yaml (default: ~/.job-agent/config.yaml).
# Empty lists mean all saved jobs. No profession or city is built in.
directions: []  # jd_requirements: literal keywords in title/JD, OR matching
cities: []      # default jd_requirements city filter
platforms: []   # boss, liepin, 51job, zhilian; [] = all
browser:
  name: ego-lite # the running Ego Lite instance (see docs/browser.md)
  cdp_url: http://127.0.0.1:9222
  keepalive_seconds: 300 # own Ego engine; 0 disables; idle control vanished at 25–30 min
# Browser settings are exposed by status; own browser access goes through Ego Lite.

mode: job      # practice or job; interpreted by the Agent, not an automatic sender
practice:
  max_interviews_per_week: 3
stretch_salary_min: null # monthly K CNY; null = no stretch line configured

# Highest-scoring unique companies only; 0 disables customization.
greetings:
  top_n: 20
  generate:
    enabled: false # 开启须本人确认费用；只在 send_message 岗位预览阶段生成
    model: gpt-6.1-sol
    service_tier: priority
    facts: [] # 本人核实的真实硬结果；允许改成聊天说法，不改变事实或数字
    max_retries: 1 # 最多一次内容重试；接口异常立即使用通过 lint 的通用兜底
    daily_budget_calls: 300 # 重试也计入每日付费调用上限
    templates_path: $JOB_AGENT_HOME/greeting-templates.yaml
    max_sentence_length: 25
    similarity_threshold: 0.78 # 同批任意两条完整第二段，超过即重试
    max_sentence_pattern: 3 # 同批去掉JD词后的开头句式最多三次
    closing_lines: [简历发你看看？, 方便的话发份简历给你？, 有兴趣的话我发简历过来。, 要不我发份简历给你？, 我把简历发来看看？, 合适的话我发简历过来。]
    jargon_terms: [RAG, MCP, Agent, LLM, BM25, RRF, Rerank, Embedding, LangChain, LangGraph, pgvector, 混合检索, 端到端延迟, 多智能体, 多Agent路由, 向量检索, 向量数据库, 研发自动化流水线, DAG, Token, Function Calling, Mem0, JEV, GEPA, LoRA, vLLM]
    # 显式配置替换默认黑名单；省略则沿用以下默认值。
    blacklist: [看了贵公司, 非常符合, 十分契合, 希望有机会, 期待您的回复, 我相信我能, 贵公司, 贵司, 非常匹配, 高度匹配, 深受吸引, 赋能, 助力, 核心落地经验, 攻克, 深耕, 致力于, 期待加入, 看到贵公司正在招聘, 您好，看到, 您, 体现了, 具备, 能力, 主导开发, 问答服务, 系统设计, 想了解目前的难点, 想听听需求, 想聊聊方案, 想了解具体怎么做, 想聊聊具体需求, 想听听具体的需求]
# 可选小经历只读加载自 $JOB_AGENT_HOME/greeting-facts.yaml，格式见 greeting-facts.example.yaml。
# confirmed 必须为 YAML 布尔 true 才能使用；不自动复制示例或写入生产目录。
# own 的频率和每日限额由 engine.platforms 配置。
delivery:
  confirm_ttl_minutes: 30 # 1–30; shorter is allowed, never extend existing tokens
  preview_limit: 5       # 1–30; explicit job_ids binds exactly those IDs (max 30)
analytics:
  activity_days: 7       # 1–365; affects history only, funnel remains all-time
  score_bands: [60, 80]  # increasing integer lower bounds: 0–59, 60–79, 80–100

# 付费评分：先 preview_scoring 看请求数，用户授权后 start_scoring(confirm=true)。
# 不由每日任务自动调用；每批最多10个选定岗位，串行，无自动重试。
scoring:
  require_ratelimit_header: true  # 默认余额未知时暂停；兼容不返回限流头的服务可设 false
  model: gpt-6.1-sol
  service_tier: priority
  base_url: https://api.openai.com/v1
  max_completion_tokens: 1200
  connect_timeout_seconds: 5 # 每个地址的连接等待上限，避免坏 IPv6 拖慢回退
  timeout_seconds: 60 # 连接后等待模型响应
  max_jobs: 10
  max_input_chars: 60000 # 主简历+经历+JD 超限时报错，不截断
  resume_path: ~/.job-agent/resume.md # 显式主简历，UTF-8 文本/Markdown
  key_source: vault # 或 env，使用 api_key_env
  api_key_env: OPENAI_API_KEY
  vault_path: ~/.config/ai-vault/vault.json
  vault_group: personal-infra
  vault_service: openai
  vault_key: OPENAI_PLATFORM_API_KEY

# All channels AND the master switch default to false. Secret VALUES must never
# appear here; inject the referenced environment variables into the process.
notify:
  enabled: false
  interval_minutes: 5
  delivery_summary: true # completed/failed deliver summaries to enabled Telegram channels
  channels:
    telegram:
      type: telegram
      enabled: false
      bot_token_env: JOB_AGENT_TG_BOT_TOKEN
      chat_id: "" # your own private chat ID
    wecom:
      type: webhook
      format: wecom
      enabled: false
      url_env: JOB_AGENT_WECOM_WEBHOOK_URL
    serverchan:
      type: webhook
      format: serverchan
      enabled: false
      sendkey_env: JOB_AGENT_SERVERCHAN_SENDKEY
    # A generic webhook receives JSON {title, text, url}.
    # custom:
    #   type: webhook
    #   enabled: false
    #   url_env: JOB_AGENT_WEBHOOK_URL


# MCP/CLI 共用自建服务；backend 仅接受 own。
engine:
  max_job_age_hours: 48  # 采集超过此时长，投递前只读确认仍在招；下架不占额度
  greeting: "" # 全局固定默认；平台省略 greeting 则继承，显式空串也会覆盖
  greeting_paragraph_separator: "\n\n" # 不支持空行的平台覆盖为 ""，以句号连接3–4段
  greeting_newline_separator: "；"
  backend: own
  cooldown:
    days: 30
    company_patterns:
      - '[（(][^()（）]*[)）]'
      - '(?:股份有限责任公司|股份有限公司|有限责任公司|有限公司)$'
    title_patterns:
      - '急招|诚聘|高薪|招聘'
      - '\d+(?:\.\d+)?\s*[-~—至]\s*\d+(?:\.\d+)?\s*[kK千万](?:[/·].*)?'
  dry_run: true # offline Fake only; use an explicitly separate database
  live_send_enabled: false # true AND dry_run:false AND immutable confirmed batch required
  company_exclude: []        # 投递时跳过公司名含这些词的岗位（如大厂），对已入库岗位也生效
  title_exclude: []          # 岗位名含这些词就跳过（如 实习、Intern）
  salary_floor_max_k: null   # 起薪（月薪下限，K）高于此值的岗位跳过；null 不限
  weekend_daily_limit: null  # 兼容旧配置：周六日上限，与 day_limits 及平台 daily_limit 取小
  day_limits: {}             # 例如 {sat: 2, sun: 2}；mon..sun，0 表示当天不投
  day_allowed_hours: {}      # 例如 {sat: ['10:00', '16:00']}；覆盖 rate.allowed_hours
  # engine.platforms.<平台> 可设同名 day_limits/day_allowed_hours，按星期覆盖全局规则。
  stop_on_unverified: false # false：结果不明的岗位跳过（不重投），其余照常；true：该平台本批停止
  monitor:
    task_space_name: "job-agent 监听"
    backfill_hours: 48 # 相对首次激活时间的回填窗口；按平台覆盖，重启不移动激活时间
    interval_minutes: 5 # 未匹配分时段规则时的间隔
    interval_schedule: [] # 按顺序首个匹配生效；使用 engine.timezone
    # interval_schedule:
    #   - {allowed_hours: ['21:00', '08:00'], interval_minutes: 15}
    allowed_hours: ['09:00', '21:00'] # 仅监听；沿用平台 rate.timezone，跨午夜如 ['21:00', '09:00']
    failure_threshold: 3
    platforms: [boss, zhilian, liepin, "51job"]
    notify: {interview: true, resume_request: true, reply: true, rejection: true}
    platform_overrides: {} # 未填写的字段继承全局；notify 按类型合并，列表整体替换
    # platform_overrides:
    #   liepin:
    #     allowed_hours: ['08:00', '24:00'] # 仅示例；默认仍 09:00–21:00
    #     interval_minutes: 7
    #     interval_schedule: [{allowed_hours: ['21:00', '08:00'], interval_minutes: 15}]
    #     failure_threshold: 5
    #     backfill_hours: 24
    #     notify: {rejection: false}
    #   "51job": {enabled: false} # platforms 为白名单；可单独关闭其中的平台
  task_space_name: "job-agent 投递" # resolve/create by name; use a dedicated Agent-owned space
  timezone: Asia/Shanghai # calendar day for per-platform attempt budgets
  platforms:
    maimai:
      enabled: false # public directory only; web message/delivery entry unavailable
      greeting_max_length: 0
      daily_limit: 2
      rate:
        interval_seconds: [120, 240]
        hourly_limit: 2
    nowcoder:
      enabled: false # phase 2 draft: resume upload, successful receipts and populated replies await live acceptance
      greeting_max_length: 0 # after acceptance use 1 with empty greeting and greeting_mode: none
      greeting_mode: none # application only; no chat greeting
      greeting: ""
      daily_limit: 2
      rate:
        interval_seconds: [120, 240]
        hourly_limit: 2
    boss:
      expected_account_type: any # student / professional only when explicitly required
      enabled: false
      # greeting: "" # 可选平台覆盖
      greeting_mode: send_message
      greeting_newline_separator: "；" # unsupported/unverified platform newline fallback; also accepts " "
      greeting_max_length: 0 # unknown pending P0; set verified value before enabling
      daily_limit: 140
      rate:
        interval_seconds: [45, 120]
        hourly_limit: 20
      attachment_name: "示例候选人_简历"
    zhilian:
      expected_account_type: any # student / professional only when explicitly required
      enabled: false
      # greeting: "" # 可选平台覆盖
      greeting_mode: platform_default
      greeting_max_length: 0 # pending P0, not a claim about the platform
      daily_limit: 90
      rate:
        interval_seconds: [45, 120]
        hourly_limit: 20
      attachment_name: "示例候选人_简历"
    liepin:
      expected_account_type: any # student / professional only when explicitly required
      enabled: false
      # greeting: "" # 可选平台覆盖
      greeting_mode: send_message
      greeting_newline_separator: "；" # live newline method unverified; preview shows flattened text
      greeting_max_length: 0 # pending P0
      daily_limit: 1
      rate:
        interval_seconds: [45, 120]
        hourly_limit: 20
      attachment_name: "示例候选人_简历"
    51job:
      expected_account_type: any # student / professional only when explicitly required
      enabled: false
      greeting: ""
      greeting_mode: none
      greeting_max_length: 0 # pending P0
      daily_limit: 1
      rate:
        interval_seconds: [45, 120]
        hourly_limit: 20
      attachment_name: "示例候选人_简历"

# Read-only collection (#15). Daily limits count search requests, including failed/empty pages.
# Detail visits are optional, paced by the same interval, and do not consume search quota.
# City codes below are reference data; JobSource maps SearchQuery.city in its pages.py.
collect:
  keywords:
  - AI应用开发工程师
  - Agent开发工程师
  - 大模型应用开发工程师
  cities:
  - 苏州
  - 上海
  - 杭州
  - 南京
  - 无锡
  - 合肥
  task_space_name: job-agent 采集
  timezone: Asia/Shanghai
  platform_timeout_seconds: null  # 自动按页数、操作、节奏、休息和余量估算；数字为手动覆盖
  fetch_jd: false
  refresh_daily: false  # true：每天各关键词/城市首屏刷新，受每日预算限制
  filters:
    salary_min_k: 8
    title_exclude: []
    company_exclude: []
    blocked_companies: []
  platforms:
    maimai:
      enabled: false
      daily_page_limit: 2
      rate:
        interval_seconds: [120, 240]
        hourly_limit: 2
    nowcoder:
      enabled: false
      daily_page_limit: 2
      rate:
        interval_seconds: [120, 240]
        hourly_limit: 2
    boss:
      enabled: false
      daily_page_limit: 20
      rate:
        interval_seconds: [45, 120]
        hourly_limit: 20
      city_codes:
        苏州: '101190400'
        上海: '101020100'
        杭州: '101210100'
        南京: '101190100'
    zhilian:
      enabled: false
      daily_page_limit: 20
      rate:
        interval_seconds: [45, 120]
        hourly_limit: 20
      city_codes:
        苏州: '639'
        上海: '538'
        杭州: '653'
        南京: '635'
    liepin:
      enabled: false
      daily_page_limit: 20
      rate:
        interval_seconds: [45, 120]
        hourly_limit: 20
      city_codes:
        苏州: 060080
        上海: '020'
        杭州: '070020'
        南京: '060020'
    51job:
      enabled: false
      daily_page_limit: 20
      rate:
        interval_seconds: [45, 120]
        hourly_limit: 20
      city_codes:
        上海: '020000'
        苏州: '070300'
        杭州: 080200
        南京: '070200'

# 每天自动执行采集 -> 投递；所有入口默认关闭，需用户明确授权。
daily:
  enabled: false
  collect_enabled: true
  deliver_enabled: false
  hour: 8
  minute: 0
  unverified_cooldown_minutes: 30  # 仅 stop_on_unverified: true 时生效；某平台出现结果不明：只暂停该平台，冷却后由每 30 分钟的检查续投其余岗位
  unverified_daily_stop: 3         # 当天该平台累计这么多条不明，就停到明天
# 日常配置还需 collect.fetch_jd: true、collect.refresh_daily: true；四个平台 enabled: true。
# engine.cooldown 默认 days: 30，规范化正则可按 README 的配置覆盖。

# #46: conservative rates for the own backend. Optional rate blocks belong under
# engine.platforms.<platform> or collect.platforms.<platform>, for example:
# rate:
#   interval_seconds: [45, 120]
#   hourly_limit: 20
#   rest_every: [8, 15]
#   rest_seconds: [300, 900]
#   allowed_hours: ['09:00', '21:00']
#   timezone: Asia/Shanghai
# Missing rate.daily_limit inherits delivery daily_limit / collection daily_page_limit.
# collect.platform_timeout_seconds defaults to null (pace-based budget, includes rest waits).
# browser.human_input defaults and compatibility/release notes: README section #46.

# #50 可选项（添加到上面的同名节点，不要重复定义 YAML 节点）：
# engine.minimum_hr_activity: null  # null 不过滤；now / today / three_days / week
# engine.experience_priority: [应届, 经验不限, 1-3年]  # 默认 []；活跃度之后、分数之前
# engine.monitor.classification_enabled: true
# engine.monitor.classification_model_enabled: false  # 开启后复用 scoring 的模型、key 和超时
# engine.monitor.classification_model_limit: 5  # 每轮监听全平台合计，0..30，无自动重试
# engine.monitor.classification_batch_limit: 20  # 每轮每个平台批量；积压持久保留到下一轮
# analytics.greeting_min_samples: 20  # 版本样本数不足时只显示“样本不足”
