[project]
name = "job-agent-mcp"
version = "0.1.0"
description = "Local job-agent MCP with owned collection, scoring, delivery and monitoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2", "PyYAML>=6,<7", "pypdf>=5,<7", "python-docx>=1.2,<2"]

[project.scripts]
job-agent = "job_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["job_agent*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"job_agent.browser" = ["humanize.js"]
"job_agent.service" = ["prompts/*.txt"]

"job_agent" = ["prompts/*.md", "prompts/*.json", "prompts/*.yaml"]
